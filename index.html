<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade LED Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --border: #333;
            --accent: #00e5ff;
            --accent-dim: #00a0b0;
            --text: #e0e0e0;
            --text-dim: #888;
            --success: #00ff88;
            --warning: #ffcc00;
            --danger: #ff3333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            min-height: 100vh;
            padding: 16px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 20px;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-dim);
            flex-shrink: 0;
        }

        .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.error     { background: var(--danger);  box-shadow: 0 0 8px var(--danger); }

        #statusText {
            color: var(--text-dim);
            font-size: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
        }

        .card h2 {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .card.full-width {
            grid-column: 1 / -1;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            background: #222;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 7px 14px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        button:hover {
            background: #2e2e2e;
            border-color: var(--accent-dim);
        }

        button.primary {
            background: #004455;
            border-color: var(--accent-dim);
            color: var(--accent);
        }

        button.primary:hover {
            background: #005566;
            border-color: var(--accent);
        }

        button.warning {
            background: #443300;
            border-color: #886600;
            color: var(--warning);
        }

        button.warning:hover {
            background: #554400;
            border-color: var(--warning);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="number"],
        input[type="color"] {
            background: #111;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 13px;
            width: 100%;
        }

        select:focus,
        input:focus {
            outline: 1px solid var(--accent-dim);
        }

        input[type="color"] {
            padding: 2px 4px;
            height: 32px;
            cursor: pointer;
        }

        .events-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .event-btn {
            font-size: 11px;
            padding: 5px 10px;
        }

        .event-btn.high   { border-color: #662222; color: #ff8888; }
        .event-btn.high:hover   { border-color: var(--danger); background: #330000; }
        .event-btn.medium { border-color: #665500; color: #ffcc66; }
        .event-btn.medium:hover { border-color: var(--warning); background: #332200; }
        .event-btn.system { border-color: #224466; color: #88ccff; }
        .event-btn.system:hover { border-color: #4488ff; background: #001122; }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .log-header h2 {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            margin: 0;
            padding: 0;
        }

        #log {
            background: #080808;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 10px;
            height: 220px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry { padding: 1px 0; }
        .log-entry .time    { color: #555; }
        .log-entry.sent .dir   { color: var(--accent-dim); }
        .log-entry.recv .dir   { color: var(--success); }
        .log-entry.info .dir   { color: var(--text-dim); }
        .log-entry.error .dir  { color: var(--danger); }
        .log-entry.sent .payload  { color: #ccc; }
        .log-entry.recv .payload  { color: var(--success); }
        .log-entry.info .payload  { color: var(--text-dim); }
        .log-entry.error .payload { color: var(--danger); }

        /* Segment-Matrix */
        .seg-matrix {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 4px;
        }

        .seg-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border: 1px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            user-select: none;
        }

        .seg-row:hover { border-color: var(--border); background: #111; }

        .seg-row input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .seg-name {
            flex: 1;
            font-size: 12px;
            color: var(--text-dim);
            transition: color 0.1s;
        }

        .seg-row:has(input:checked) .seg-name { color: var(--text); }

        .seg-dir {
            width: auto !important;
            padding: 3px 6px !important;
            font-size: 11px !important;
        }

        .seg-all-row {
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        .seg-all-row .seg-name { color: var(--accent-dim); }
        .seg-all-row:has(input:checked) .seg-name { color: var(--accent); }

        .seg-individual { transition: opacity 0.15s; }

        .btn-sm {
            padding: 3px 8px;
            font-size: 11px;
        }

        .card-span2 { grid-row: span 2; }

        /* Simulator */
        .sim-card { overflow-x: auto; }

        #simCanvas {
            display: block;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: #080808;
        }

        .sim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .sim-header h2 {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            padding: 0;
            border: none;
        }
    </style>
</head>

<body>
    <header>
        <div class="status-dot" id="statusDot"></div>
        <h1>Arcade LED Control</h1>
        <span id="statusText">Verbinde...</span>
    </header>

    <div class="grid">

        <!-- Attract Mode -->
        <div class="card">
            <h2>Attract Mode</h2>
            <div class="btn-row">
                <button class="warning btn-sm" onclick="sendAttract('pause')">Pause</button>
                <button class="primary btn-sm" onclick="sendAttract('resume')">Resume</button>
            </div>
        </div>

        <!-- Effect Builder -->
        <div class="card card-span2">
            <h2>Effekt Builder</h2>
            <div class="form-grid">

                <div class="form-group">
                    <label>Effekt-Typ</label>
                    <select id="effectType">
                        <option value="fill">fill</option>
                        <option value="blink">blink</option>
                        <option value="chase" selected>chase</option>
                        <option value="pulse">pulse</option>
                        <option value="rainbow">rainbow</option>
                        <option value="scanner">scanner (Knight Rider)</option>
                        <option value="sparkle">sparkle</option>
                        <option value="wipe">wipe</option>
                        <option value="off">off</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Priorität</label>
                    <select id="priority">
                        <option value="1">1 – Low (Attract)</option>
                        <option value="2" selected>2 – Medium (Treffer)</option>
                        <option value="3">3 – High (Game Over)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Farbe</label>
                    <input type="color" id="color" value="#ff00ff">
                </div>

                <div class="form-group">
                    <label>Speed (ms/Schritt)</label>
                    <input type="number" id="speed" value="50" min="1" max="5000">
                </div>

                <div class="form-group">
                    <label>Length (Schweif)</label>
                    <input type="number" id="length" value="5" min="1" max="50">
                </div>

                <div class="form-group">
                    <label>Repeat (-1 = endlos)</label>
                    <input type="number" id="repeat" value="1" min="-1" max="100">
                </div>

                <!-- Segment-Matrix: Mehrfachauswahl mit Richtung pro Segment -->
                <div class="form-group full">
                    <label>Segmente &amp; Richtung</label>
                    <div class="seg-matrix">
                        <label class="seg-row seg-all-row">
                            <input type="checkbox" id="seg99" value="99" checked onchange="onSegAllChange(this)">
                            <span class="seg-name">Alle (99)</span>
                            <select class="seg-dir" id="dir99">
                                <option value="1">→ Vorwärts</option>
                                <option value="-1">← Rückwärts</option>
                            </select>
                        </label>
                        <label class="seg-row seg-individual" id="segRow0" style="opacity:0.4">
                            <input type="checkbox" class="seg-ind" value="0" disabled>
                            <span class="seg-name">0 – Marquee</span>
                            <select class="seg-dir"><option value="1">→ Vorwärts</option><option value="-1">← Rückwärts</option></select>
                        </label>
                        <label class="seg-row seg-individual" id="segRow1" style="opacity:0.4">
                            <input type="checkbox" class="seg-ind" value="1" disabled>
                            <span class="seg-name">1 – Monitor oben</span>
                            <select class="seg-dir"><option value="1">→ Vorwärts</option><option value="-1">← Rückwärts</option></select>
                        </label>
                        <label class="seg-row seg-individual" id="segRow2" style="opacity:0.4">
                            <input type="checkbox" class="seg-ind" value="2" disabled>
                            <span class="seg-name">2 – Monitor links</span>
                            <select class="seg-dir"><option value="1">→ Vorwärts</option><option value="-1">← Rückwärts</option></select>
                        </label>
                        <label class="seg-row seg-individual" id="segRow3" style="opacity:0.4">
                            <input type="checkbox" class="seg-ind" value="3" disabled>
                            <span class="seg-name">3 – Monitor unten</span>
                            <select class="seg-dir"><option value="1">→ Vorwärts</option><option value="-1">← Rückwärts</option></select>
                        </label>
                        <label class="seg-row seg-individual" id="segRow4" style="opacity:0.4">
                            <input type="checkbox" class="seg-ind" value="4" disabled>
                            <span class="seg-name">4 – Monitor rechts</span>
                            <select class="seg-dir"><option value="1">→ Vorwärts</option><option value="-1">← Rückwärts</option></select>
                        </label>
                        <label class="seg-row seg-individual" id="segRow5" style="opacity:0.4">
                            <input type="checkbox" class="seg-ind" value="5" disabled>
                            <span class="seg-name">5 – Control Panel</span>
                            <select class="seg-dir"><option value="1">→ Vorwärts</option><option value="-1">← Rückwärts</option></select>
                        </label>
                    </div>
                </div>

                <div class="form-group full">
                    <button class="primary" onclick="sendEffect()">Effekt senden</button>
                </div>
            </div>
        </div>

        <!-- LED Simulator -->
        <div class="card sim-card">
            <div class="sim-header">
                <h2>LED Simulator – Kette A (166 LEDs)</h2>
                <button onclick="simInit()">Reset (Attract)</button>
            </div>
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- Pac-Man Events -->
        <div class="card">
            <h2>Pac-Man Ereignisse</h2>
            <div class="events-buttons">
                <button class="event-btn medium" onclick="sendEvent('pacman_pill')">Pill gegessen</button>
                <button class="event-btn medium" onclick="sendEvent('pacman_powerpill')">Power Pill</button>
                <button class="event-btn medium" onclick="sendEvent('pacman_ghost')">Geist gefressen</button>
                <button class="event-btn medium" onclick="sendEvent('pacman_fruit')">Bonus Frucht</button>
                <button class="event-btn high"   onclick="sendEvent('pacman_level')">Level Complete</button>
                <button class="event-btn high"   onclick="sendEvent('pacman_death')">Player Death</button>
                <button class="event-btn high"   onclick="sendEvent('pacman_gameover')">Game Over</button>
            </div>
        </div>

        <!-- Space Invaders Events -->
        <div class="card">
            <h2>Space Invaders Ereignisse</h2>
            <div class="events-buttons">
                <button class="event-btn medium" onclick="sendEvent('si_alien')">Alien getroffen</button>
                <button class="event-btn medium" onclick="sendEvent('si_ufo_appear')">UFO erscheint</button>
                <button class="event-btn medium" onclick="sendEvent('si_ufo_hit')">UFO getroffen</button>
                <button class="event-btn medium" onclick="sendEvent('si_bunker')">Bunker zerstört</button>
                <button class="event-btn high"   onclick="sendEvent('si_wave')">Welle komplett</button>
                <button class="event-btn high"   onclick="sendEvent('si_death')">Spieler getroffen</button>
                <button class="event-btn high"   onclick="sendEvent('si_gameover')">Game Over</button>
            </div>
        </div>

        <!-- Asteroids Events -->
        <div class="card">
            <h2>Asteroids Ereignisse</h2>
            <div class="events-buttons">
                <button class="event-btn medium" onclick="sendEvent('ast_small')">Asteroid klein</button>
                <button class="event-btn medium" onclick="sendEvent('ast_large')">Asteroid groß</button>
                <button class="event-btn medium" onclick="sendEvent('ast_ufo')">UFO erscheint</button>
                <button class="event-btn medium" onclick="sendEvent('ast_life')">Extra Leben</button>
                <button class="event-btn high"   onclick="sendEvent('ast_level')">Level Complete</button>
                <button class="event-btn high"   onclick="sendEvent('ast_death')">Spieler getroffen</button>
                <button class="event-btn high"   onclick="sendEvent('ast_gameover')">Game Over</button>
            </div>
        </div>

        <!-- System Events -->
        <div class="card">
            <h2>System Ereignisse</h2>
            <div class="events-buttons">
                <button class="event-btn system" onclick="sendEvent('sys_start_pacman')">Start Pac-Man</button>
                <button class="event-btn system" onclick="sendEvent('sys_start_si')">Start Space Invaders</button>
                <button class="event-btn system" onclick="sendEvent('sys_start_ast')">Start Asteroids</button>
                <button class="event-btn system" onclick="sendEvent('sys_end')">Spiel endet</button>
                <button class="event-btn system" onclick="sendEvent('sys_highscore')">Highscore</button>
                <button class="event-btn system" onclick="sendEvent('sys_coin')">Münze eingeworfen</button>
            </div>
        </div>

        <!-- Log -->
        <div class="card full-width">
            <div class="log-header">
                <h2>Nachrichten-Log</h2>
                <button onclick="clearLog()">Leeren</button>
            </div>
            <div id="log"></div>
        </div>

    </div>

    <script>
        let ws = null;
        const WS_URL = 'ws://localhost:8765';

        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                setStatus('connected', 'Verbunden mit ' + WS_URL);
                appendLog('info', 'Verbindung hergestellt');
            };

            ws.onmessage = (event) => {
                appendLog('recv', event.data);
            };

            ws.onclose = () => {
                setStatus('', 'Getrennt — reconnect in 3s');
                appendLog('info', 'Verbindung getrennt');
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                setStatus('error', 'Verbindungsfehler');
                appendLog('error', 'WebSocket Fehler');
            };
        }

        function setStatus(state, text) {
            document.getElementById('statusDot').className = 'status-dot ' + state;
            document.getElementById('statusText').textContent = text;
        }

        function send(payload) {
            simReceive(payload);
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendLog('error', 'Nicht verbunden');
                return;
            }
            const json = JSON.stringify(payload);
            ws.send(json);
            appendLog('sent', json);
        }

        function sendAttract(state) {
            send({ cmd: 'attract', state });
        }

        function onSegAllChange(cb) {
            document.querySelectorAll('.seg-individual').forEach(row => {
                const input = row.querySelector('.seg-ind');
                input.disabled = cb.checked;
                if (cb.checked) input.checked = false;
                row.style.opacity = cb.checked ? '0.4' : '1';
            });
        }

        function sendEffect() {
            const type     = document.getElementById('effectType').value;
            const priority = parseInt(document.getElementById('priority').value);
            const speed    = parseInt(document.getElementById('speed').value);
            const length   = parseInt(document.getElementById('length').value);
            const repeat   = parseInt(document.getElementById('repeat').value);
            const color    = hexToRgb(document.getElementById('color').value);

            const allCb = document.getElementById('seg99');
            let segment, dir;

            if (allCb.checked) {
                segment = 99;
                dir = parseInt(document.getElementById('dir99').value);
            } else {
                const checked = [...document.querySelectorAll('.seg-ind:checked')];
                if (checked.length === 0) {
                    appendLog('error', 'Kein Segment ausgewählt');
                    return;
                }
                const segs = checked.map(cb => parseInt(cb.value));
                const dirs = checked.map(cb =>
                    parseInt(cb.closest('.seg-row').querySelector('.seg-dir').value)
                );
                // Einzelnes Segment: skalare Werte; mehrere: Arrays
                segment = segs.length === 1 ? segs[0] : segs;
                dir     = dirs.length === 1 ? dirs[0] : dirs;
            }

            send({ cmd: 'effect', chain: 'A', type, segment, color, speed, length, repeat, dir, priority });
        }

        const EVENTS = {
            pacman_pill: [
                { cmd: 'effect', chain: 'A', type: 'chase', segment: 1, color: {r:255,g:215,b:0}, speed: 40, length: 5, repeat: 1, priority: 2 }
            ],
            pacman_powerpill: [
                { cmd: 'effect', chain: 'A', type: 'pulse', segment: 99, color: {r:0,g:0,b:255}, speed: 15, repeat: -1, priority: 2 }
            ],
            pacman_ghost: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 99, color: {r:255,g:255,b:255}, speed: 50, repeat: 3, priority: 2 }
            ],
            pacman_fruit: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 0, color: {r:255,g:140,b:0}, speed: 50, repeat: 5, priority: 2 }
            ],
            pacman_level: [
                { cmd: 'effect', chain: 'A', type: 'wipe', segment: 99, color: {r:255,g:215,b:0}, speed: 30, repeat: 1, priority: 3 }
            ],
            pacman_death: [
                { cmd: 'effect', chain: 'A', type: 'blink', segment: 99, color: {r:255,g:0,b:0}, speed: 150, repeat: 3, priority: 3 }
            ],
            pacman_gameover: [
                { cmd: 'effect', chain: 'A', type: 'fill', segment: 99, color: {r:255,g:0,b:0}, speed: 100, repeat: 1, priority: 3 }
            ],

            si_alien: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 99, color: {r:0,g:255,b:0}, speed: 50, repeat: 5, priority: 2 }
            ],
            si_ufo_appear: [
                { cmd: 'effect', chain: 'A', type: 'chase', segment: 0, color: {r:0,g:255,b:255}, speed: 30, length: 6, repeat: 3, priority: 2 }
            ],
            si_ufo_hit: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 0, color: {r:0,g:255,b:255}, speed: 50, repeat: 8, priority: 2 }
            ],
            si_bunker: [
                { cmd: 'effect', chain: 'A', type: 'pulse', segment: 5, color: {r:255,g:140,b:0}, speed: 40, repeat: 2, priority: 2 }
            ],
            si_wave: [
                { cmd: 'effect', chain: 'A', type: 'wipe', segment: 99, color: {r:0,g:255,b:0}, speed: 30, repeat: 1, priority: 3 }
            ],
            si_death: [
                { cmd: 'effect', chain: 'A', type: 'blink', segment: 99, color: {r:255,g:0,b:0}, speed: 150, repeat: 2, priority: 3 }
            ],
            si_gameover: [
                { cmd: 'effect', chain: 'A', type: 'fill', segment: 99, color: {r:255,g:0,b:0}, speed: 100, repeat: 1, priority: 3 }
            ],

            ast_small: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 99, color: {r:255,g:255,b:255}, speed: 50, repeat: 2, priority: 2 }
            ],
            ast_large: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 99, color: {r:255,g:255,b:255}, speed: 50, repeat: 4, priority: 2 }
            ],
            ast_ufo: [
                { cmd: 'effect', chain: 'A', type: 'chase', segment: 0, color: {r:255,g:215,b:0}, speed: 40, length: 6, repeat: 3, priority: 2 }
            ],
            ast_life: [
                { cmd: 'effect', chain: 'A', type: 'pulse', segment: 0, color: {r:0,g:255,b:255}, speed: 30, repeat: 3, priority: 2 }
            ],
            ast_level: [
                { cmd: 'effect', chain: 'A', type: 'rainbow', segment: 99, color: {r:0,g:0,b:0}, speed: 20, repeat: 2, priority: 3 }
            ],
            ast_death: [
                { cmd: 'effect', chain: 'A', type: 'blink', segment: 99, color: {r:255,g:0,b:0}, speed: 150, repeat: 3, priority: 3 }
            ],
            ast_gameover: [
                { cmd: 'effect', chain: 'A', type: 'fill', segment: 99, color: {r:255,g:0,b:0}, speed: 100, repeat: 1, priority: 3 }
            ],

            sys_start_pacman: [
                { cmd: 'effect', chain: 'A', type: 'scanner', segment: 99, color: {r:255,g:215,b:0}, speed: 20, repeat: 1, priority: 3 },
            ],
            sys_start_si: [
                { cmd: 'effect', chain: 'A', type: 'wipe', segment: 99, color: {r:0,g:255,b:0}, speed: 20, repeat: 1, priority: 3 }
            ],
            sys_start_ast: [
                { cmd: 'effect', chain: 'A', type: 'wipe', segment: 99, color: {r:0,g:255,b:255}, speed: 20, repeat: 1, priority: 3 }
            ],
            sys_end: [
                { cmd: 'attract', state: 'resume' }
            ],
            sys_highscore: [
                { cmd: 'effect', chain: 'A', type: 'rainbow', segment: 99, color: {r:0,g:0,b:0}, speed: 15, repeat: 3, priority: 3 }
            ],
            sys_coin: [
                { cmd: 'effect', chain: 'A', type: 'sparkle', segment: 0, color: {r:255,g:215,b:0}, speed: 60, repeat: 5, priority: 2 }
            ]
        };

        function sendEvent(key) {
            const commands = EVENTS[key];
            if (commands) commands.forEach(send);
        }

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }

        function appendLog(type, message) {
            const logEl = document.getElementById('log');
            const time  = new Date().toLocaleTimeString('de-DE', { hour12: false });
            const dirs  = { sent: '→', recv: '←', info: '·', error: '!' };

            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.innerHTML =
                `<span class="time">${time}</span> ` +
                `<span class="dir">${dirs[type] ?? '·'}</span> ` +
                `<span class="payload">${escapeHtml(message)}</span>`;

            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // ── LED Simulator ────────────────────────────────────────────────────

        // Buffer-Ranges aus segments.h / segments.cpp:
        // case 2 → SEG_A_MONITOR_LEFT={114,131}, case 4 → SEG_A_MONITOR_RIGHT={65,82}
        // reversed=true: LED-Strip läuft physisch entgegengesetzt zur visuellen Darstellung
        const SIM_SEGS = [
            { id: 0, name: '0 Marquee',      start: 0,   end: 33,  reversed: true  },
            { id: 1, name: '1 Mon oben',     start: 34,  end: 64,  reversed: false },
            { id: 2, name: '2 Mon links',    start: 114, end: 131, reversed: true  },
            { id: 3, name: '3 Mon unten',    start: 83,  end: 113, reversed: true  },
            { id: 4, name: '4 Mon rechts',   start: 65,  end: 82,  reversed: false },
            { id: 5, name: '5 Control',      start: 132, end: 165, reversed: false },
        ];
        const SIM_LEDS     = 166;
        const SIM_LED_W    = 7, SIM_LED_H = 7, SIM_LED_GAP = 1, SIM_LED_STEP = 8;
        const SIM_LABEL_W  = 80, SIM_PAD_X = 8, SIM_PAD_Y = 8;
        const SIM_ROW_H    = 12, SIM_ROW_GAP = 3;
        const SIM_SIDE_H   = 18 * SIM_LED_STEP - SIM_LED_GAP;            // 143px
        const SIM_Y_SIDES  = SIM_PAD_Y + 2 * (SIM_ROW_H + SIM_ROW_GAP); // 38px
        const SIM_CANVAS_W = SIM_PAD_X + SIM_LABEL_W + 34 * SIM_LED_STEP - SIM_LED_GAP + SIM_PAD_X;
        const SIM_CANVAS_H = SIM_PAD_Y + 4 * SIM_ROW_H + 4 * SIM_ROW_GAP + SIM_SIDE_H + SIM_PAD_Y;

        let simBuf            = Array.from({ length: SIM_LEDS }, () => [0, 0, 0]);
        let simFx             = [];
        let simAttractTpl     = null;
        let simAttractPaused  = false;

        function simSin8(x) {
            return Math.round((Math.sin((x & 0xFF) * Math.PI / 128) + 1) * 127.5);
        }

        function simScale(color, s) {
            return [(color[0] * s) >> 8, (color[1] * s) >> 8, (color[2] * s) >> 8];
        }

        function simHsv(h, s, v) {
            h &= 0xFF;
            if (s === 0) return [v, v, v];
            const reg = (h * 6) >> 8;
            const rem = (h * 6) & 0xFF;
            const p = (v * (255 - s)) >> 8;
            const q = (v * (255 - ((s * rem) >> 8))) >> 8;
            const t = (v * (255 - ((s * (255 - rem)) >> 8))) >> 8;
            switch (reg) {
                case 0: return [v, t, p]; case 1: return [q, v, p];
                case 2: return [p, v, t]; case 3: return [p, q, v];
                case 4: return [t, p, v]; default: return [v, p, q];
            }
        }

        function simClear(seg) {
            for (let i = seg.start; i <= seg.end; i++) simBuf[i] = [0, 0, 0];
        }

        function simFill(seg, c) {
            for (let i = seg.start; i <= seg.end; i++) simBuf[i] = [...c];
        }

        function simMakeFx(tpl, segId, dir) {
            return {
                type:        tpl.type      ?? 'off',
                color:       [tpl.color?.r ?? 0, tpl.color?.g ?? 0, tpl.color?.b ?? 0],
                speed:       tpl.speed     ?? 100,
                length:      tpl.length    ?? 5,
                repeat:      tpl.repeat    ?? -1,
                dir:         dir           ?? 1,
                priority:    tpl.priority  ?? 1,
                segmentId:   segId,
                step:        0,
                lastUpdate:  0,
                repeatCount: 0,
                finished:    false,
            };
        }

        function simInit() {
            simAttractTpl    = { type: 'pulse', color: {r:0,g:100,b:200}, speed: 30, length: 5, repeat: -1, priority: 1 };
            simAttractPaused = false;
            simFx = SIM_SEGS.map(s => simMakeFx(simAttractTpl, s.id, 1));
        }

        function simReceive(payload) {
            if (payload.cmd === 'attract') {
                simAttractPaused = payload.state === 'pause';
                if (!simAttractPaused) simFx = SIM_SEGS.map(s => simMakeFx(simAttractTpl, s.id, 1));
                return;
            }
            if (payload.cmd !== 'effect') return;

            const seg = payload.segment;
            const dir = payload.dir ?? 1;

            const applyTo = (segId, d) => {
                const inc = simMakeFx(payload, segId, d);
                if (inc.priority >= simFx[segId].priority) simFx[segId] = inc;
            };

            if (seg === 99) {
                SIM_SEGS.forEach((_, i) => applyTo(i, Array.isArray(dir) ? (dir[i] ?? 1) : dir));
            } else if (Array.isArray(seg)) {
                seg.forEach((id, i) => { if (id < SIM_SEGS.length) applyTo(id, Array.isArray(dir) ? (dir[i] ?? 1) : dir); });
            } else if (seg < SIM_SEGS.length) {
                applyTo(seg, Array.isArray(dir) ? dir[0] : dir);
            }
        }

        function simStep(fx, seg, now) {
            if (fx.finished) return;
            const len = seg.end - seg.start + 1;
            const c   = fx.color;

            switch (fx.type) {
                case 'off': { simClear(seg); fx.finished = true; break; }

                case 'fill': {
                    simFill(seg, c);
                    if (fx.repeat !== -1) fx.finished = true;
                    break;
                }

                case 'blink': {
                    if (now - fx.lastUpdate < fx.speed) break;
                    fx.lastUpdate = now;
                    const on = fx.step % 2 === 0;
                    simFill(seg, on ? c : [0, 0, 0]);
                    fx.step++;
                    if (!on) { fx.repeatCount++; if (fx.repeat !== -1 && fx.repeatCount >= fx.repeat) fx.finished = true; }
                    break;
                }

                case 'chase': {
                    if (now - fx.lastUpdate < fx.speed) break;
                    fx.lastUpdate = now;
                    simClear(seg);
                    for (let t = 0; t < fx.length; t++) {
                        const pos = fx.dir >= 0 ? fx.step - t : (len - 1 - fx.step) + t;
                        if (pos >= 0 && pos < len) {
                            const bri = 255 - Math.floor(255 / fx.length * t);
                            simBuf[seg.start + pos] = simScale(c, bri);
                        }
                    }
                    fx.step++;
                    if (fx.step >= len) { fx.step = 0; fx.repeatCount++; if (fx.repeat !== -1 && fx.repeatCount >= fx.repeat) fx.finished = true; }
                    break;
                }

                case 'pulse': {
                    const period = 60000 / Math.max(1, fx.speed);
                    simFill(seg, simScale(c, simSin8((now % period) * 255 / period)));
                    break;
                }

                case 'rainbow': {
                    if (now - fx.lastUpdate < fx.speed) break;
                    fx.lastUpdate = now;
                    const base = fx.step & 0xFF;
                    for (let i = 0; i < len; i++)
                        simBuf[seg.start + i] = simHsv((base + Math.floor(i * 256 / len)) & 0xFF, 255, 255);
                    fx.step++;
                    if ((fx.step & 0xFF) === 0) { fx.repeatCount++; if (fx.repeat !== -1 && fx.repeatCount >= fx.repeat) fx.finished = true; }
                    break;
                }

                case 'sparkle': {
                    if (now - fx.lastUpdate < fx.speed) break;
                    fx.lastUpdate = now;
                    for (let i = seg.start; i <= seg.end; i++) simBuf[i] = simScale(simBuf[i], 128);
                    const sparks = Math.max(1, Math.floor(len / 8));
                    for (let s = 0; s < sparks; s++)
                        simBuf[seg.start + Math.floor(Math.random() * len)] = [...c];
                    fx.repeatCount++;
                    if (fx.repeat !== -1 && fx.repeatCount >= fx.repeat) fx.finished = true;
                    break;
                }

                case 'wipe': {
                    if (now - fx.lastUpdate < fx.speed) break;
                    fx.lastUpdate = now;
                    if (fx.step < len) {
                        simBuf[fx.dir >= 0 ? seg.start + fx.step : seg.end - fx.step] = [...c];
                        fx.step++;
                    } else {
                        fx.repeatCount++;
                        if (fx.repeat !== -1 && fx.repeatCount >= fx.repeat) { fx.finished = true; }
                        else { simClear(seg); fx.step = 0; }
                    }
                    break;
                }

                case 'scanner': {
                    if (now - fx.lastUpdate < fx.speed) break;
                    fx.lastUpdate = now;
                    if (len < 3) break;
                    const half  = Math.floor(len / 2);
                    const total = half * 2;
                    const fade  = 255 - Math.floor(200 / Math.max(1, fx.length));
                    for (let i = seg.start; i <= seg.end; i++) simBuf[i] = simScale(simBuf[i], fade);
                    const raw    = fx.step < half ? fx.step : (2 * half - 1) - fx.step;
                    const offset = fx.dir >= 0 ? raw : (half - 1) - raw;
                    const center = seg.start + half;
                    const lp = center - offset, rp = center + offset;
                    if (lp >= seg.start && lp <= seg.end) simBuf[lp] = [...c];
                    if (rp !== lp && rp >= seg.start && rp <= seg.end) simBuf[rp] = [...c];
                    fx.step++;
                    if (fx.step >= total) { fx.step = 0; fx.repeatCount++; if (fx.repeat !== -1 && fx.repeatCount >= fx.repeat) fx.finished = true; }
                    break;
                }
            }
        }

        function simDrawLed(ctx, x, y, color) {
            const [r, g, b] = color;
            const luma = (r * 299 + g * 587 + b * 114) / 1000;
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x, y, SIM_LED_W, SIM_LED_H);
            if (luma > 3) {
                ctx.shadowColor = `rgb(${r},${g},${b})`;
                ctx.shadowBlur  = luma > 80 ? 6 : 3;
                ctx.fillStyle   = `rgb(${r},${g},${b})`;
                ctx.fillRect(x, y, SIM_LED_W, SIM_LED_H);
                ctx.shadowBlur  = 0;
            }
        }

        function simRender() {
            const canvas = document.getElementById('simCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#080808';
            ctx.fillRect(0, 0, SIM_CANVAS_W, SIM_CANVAS_H);

            const lx = SIM_PAD_X + SIM_LABEL_W;

            // Y-Positionen der Zeilen
            const y0 = SIM_PAD_Y;
            const y1 = y0 + SIM_ROW_H + SIM_ROW_GAP;
            const yS = SIM_Y_SIDES;
            const y3 = yS + SIM_SIDE_H + SIM_ROW_GAP;
            const y5 = y3 + SIM_ROW_H + SIM_ROW_GAP;

            ctx.font = '9px Courier New, monospace';
            ctx.textBaseline = 'middle';

            // buf(seg, pos): Buffer-Index unter Berücksichtigung der physischen Richtung
            const buf = (seg, pos) => seg.reversed
                ? simBuf[seg.end - pos]
                : simBuf[seg.start + pos];

            // Horizontale Segmente
            const drawH = (seg, y) => {
                ctx.fillStyle = '#555';
                ctx.textAlign = 'left';
                ctx.fillText(seg.name, SIM_PAD_X, y + SIM_ROW_H / 2);
                const ly = y + (SIM_ROW_H - SIM_LED_H) / 2;
                const len = seg.end - seg.start + 1;
                for (let p = 0; p < len; p++)
                    simDrawLed(ctx, lx + p * SIM_LED_STEP, ly, buf(seg, p));
            };

            drawH(SIM_SEGS[0], y0);
            drawH(SIM_SEGS[1], y1);
            drawH(SIM_SEGS[3], y3);
            drawH(SIM_SEGS[5], y5);

            // Vertikale Segmente — ausgerichtet an den Außenkanten von Monitor oben (31 LEDs)
            const xL = lx;
            const xR = lx + 30 * SIM_LED_STEP;

            const drawV = (seg, x, y, labelLeft) => {
                const len = seg.end - seg.start + 1;
                for (let p = 0; p < len; p++)
                    simDrawLed(ctx, x, y + p * SIM_LED_STEP, buf(seg, p));
                ctx.save();
                ctx.fillStyle = '#555';
                ctx.font = '9px Courier New, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.translate(
                    labelLeft ? SIM_PAD_X + 6 : x + SIM_LED_W + 10,
                    y + SIM_SIDE_H / 2
                );
                ctx.rotate(labelLeft ? -Math.PI / 2 : Math.PI / 2);
                ctx.fillText(seg.name, 0, 0);
                ctx.restore();
            };

            drawV(SIM_SEGS[2], xL, yS, true);
            drawV(SIM_SEGS[4], xR, yS, false);
        }

        function simTick(now) {
            requestAnimationFrame(simTick);
            for (let i = 0; i < SIM_SEGS.length; i++) {
                if (simFx[i].finished && !simAttractPaused)
                    simFx[i] = simMakeFx(simAttractTpl, i, 1);
                simStep(simFx[i], SIM_SEGS[i], now);
            }
            simRender();
        }

        function simStart() {
            const canvas = document.getElementById('simCanvas');
            const dpr    = window.devicePixelRatio || 1;
            canvas.width        = Math.round(SIM_CANVAS_W * dpr);
            canvas.height       = Math.round(SIM_CANVAS_H * dpr);
            canvas.style.width  = SIM_CANVAS_W + 'px';
            canvas.style.height = SIM_CANVAS_H + 'px';
            canvas.getContext('2d').scale(dpr, dpr);
            simInit();
            requestAnimationFrame(simTick);
        }

        // ── Ende Simulator ───────────────────────────────────────────────────

        simStart();
        connect();
    </script>
</body>
